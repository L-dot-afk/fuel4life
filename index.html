<style>
/* ======================================================================
   PALETTES
   Each theme carries four panel tints (p1–p4) used to colour sections so
   no two neighbouring blocks look the same, three illustration fills
   (t1–t3), and one dark line colour the drawings are outlined in.
   ====================================================================== */
:root,
:root[data-theme="fresh"]{
  --paper:#F5F3EC; --card:#FFFFFF; --edge:rgba(21,51,42,.11);
  --ink:#15332A; --ink-70:rgba(21,51,42,.72); --ink-45:rgba(21,51,42,.47);
  --ink-12:rgba(21,51,42,.13); --ink-06:rgba(21,51,42,.055);
  --accent:#A6E5C3; --on-accent:#0E261F;
  --btn:#15332A; --btn-ink:#F5F3EC;
  --p1:#DCF0E2; --p2:#DCF1F4; --p3:#EDF4D8; --p4:#FFE2E7;
  --t1:#6FCB9B; --t2:#F5C24E; --t3:#F4899C;
  --line:#15332A; --alert:#F4899C;
  --shadow:0 1px 2px rgba(21,51,42,.05), 0 6px 18px rgba(21,51,42,.05);
  --face:#A6E5C3; --muzzle:#EDF4D8; --mono-bg:#15332A;
  --tc:#F5F3EC;
}
:root[data-theme="night"]{
  --paper:#0F1A2A; --card:#1A2740; --edge:rgba(233,240,249,.14);
  --ink:#E9F0F9; --ink-70:rgba(233,240,249,.74); --ink-45:rgba(233,240,249,.52);
  --ink-12:rgba(233,240,249,.17); --ink-06:rgba(255,255,255,.06);
  --accent:#7FE0C8; --on-accent:#06201B;
  --btn:#7FE0C8; --btn-ink:#06201B;
  --p1:#22374F; --p2:#2A3C5E; --p3:#1E4449; --p4:#43334F;
  --t1:#7FE0C8; --t2:#F2C15C; --t3:#F58BA0;
  --line:#0A1320; --alert:#F58BA0;
  --shadow:0 1px 2px rgba(0,0,0,.26), 0 8px 22px rgba(0,0,0,.32);
  --face:#7FE0C8; --muzzle:#CFF3EA; --mono-bg:#07121C;
  --tc:#0F1A2A;
}
:root[data-theme="summer"]{
  --paper:#FFF4E4; --card:#FFFFFF; --edge:rgba(58,39,22,.13);
  --ink:#3A2716; --ink-70:rgba(58,39,22,.74); --ink-45:rgba(58,39,22,.5);
  --ink-12:rgba(58,39,22,.14); --ink-06:rgba(58,39,22,.06);
  --accent:#FFC168; --on-accent:#3A2716;
  --btn:#3A2716; --btn-ink:#FFF4E4;
  --p1:#FFE4BE; --p2:#D6EFE5; --p3:#FFDBD1; --p4:#EFECC6;
  --t1:#FFAE47; --t2:#5FC7AE; --t3:#FF8570;
  --line:#3A2716; --alert:#FF8570;
  --shadow:0 1px 2px rgba(120,80,20,.06), 0 6px 18px rgba(120,80,20,.08);
  --face:#FFC168; --muzzle:#FFE4BE; --mono-bg:#3A2716;
  --tc:#FFF4E4;
}
:root[data-theme="winter"]{
  --paper:#EDF1F7; --card:#FFFFFF; --edge:rgba(21,39,58,.13);
  --ink:#15273A; --ink-70:rgba(21,39,58,.74); --ink-45:rgba(21,39,58,.5);
  --ink-12:rgba(21,39,58,.14); --ink-06:rgba(21,39,58,.055);
  --accent:#B7D4EE; --on-accent:#15273A;
  --btn:#15273A; --btn-ink:#EDF1F7;
  --p1:#D9E7F5; --p2:#E2DEF1; --p3:#D8ECE8; --p4:#F3DEE6;
  --t1:#6FA3D8; --t2:#A48FD0; --t3:#E08BA8;
  --line:#15273A; --alert:#E08BA8;
  --shadow:0 1px 2px rgba(21,39,58,.05), 0 6px 18px rgba(21,39,58,.07);
  --face:#B7D4EE; --muzzle:#E2EEF9; --mono-bg:#15273A;
  --tc:#EDF1F7;
}
/* Built for readability first: maximum contrast, solid borders, no tint washes */
:root[data-theme="hc"]{
  --paper:#FFFFFF; --card:#FFFFFF; --edge:#000000;
  --ink:#000000; --ink-70:#2A2A2A; --ink-45:#444444;
  --ink-12:#000000; --ink-06:#F0F0F0;
  --accent:#FFE800; --on-accent:#000000;
  --btn:#000000; --btn-ink:#FFFFFF;
  --p1:#FFFFFF; --p2:#FFF9CC; --p3:#FFFFFF; --p4:#FFF9CC;
  --t1:#FFE800; --t2:#FFFFFF; --t3:#FFF9CC;
  --line:#000000; --alert:#FFE800;
  --shadow:none;
  --face:#FFE800; --muzzle:#FFFFFF; --mono-bg:#000000;
  --tc:#FFFFFF;
}
:root[data-theme="hc"] .card,
:root[data-theme="hc"] .row,
:root[data-theme="hc"] .acc,
:root[data-theme="hc"] .stat,
:root[data-theme="hc"] .line,
:root[data-theme="hc"] .voice,
:root[data-theme="hc"] .q,
:root[data-theme="hc"] .chat,
:root[data-theme="hc"] .pill,
:root[data-theme="hc"] .opt,
:root[data-theme="hc"] .swatch{border:2px solid #000}
:root[data-theme="hc"] .top,
:root[data-theme="hc"] .tabs{border-color:#000; border-width:2px}
:root[data-theme="hc"] .note{border:2px solid #000; background:#fff}
:root[data-theme="hc"] .pill[aria-pressed="true"],
:root[data-theme="hc"] .tabs button[aria-current="page"]{outline:2px solid #000; outline-offset:-2px}

/* text size — the reading-critical sizes all derive from --fs */
:root{ --fs:17px; }
:root[data-size="large"]{ --fs:19px; }
:root[data-size="xl"]{ --fs:21.5px; }

:root{
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Karla','Segoe UI',system-ui,-apple-system,sans-serif;
  --app:520px; --r:18px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%; background:var(--ink-06)}
body{
  font-family:var(--body); font-size:var(--fs); line-height:1.55;
  color:var(--ink); -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center; overscroll-behavior:none;
}
h1,h2,h3{font-family:var(--display); font-weight:800; line-height:1.15; margin:0; letter-spacing:-.022em}
h1{font-size:calc(var(--fs) * 1.66)}
h2{font-size:calc(var(--fs) * 1.19)}
h3{font-size:var(--fs); font-weight:600; letter-spacing:-.01em}
p{margin:0 0 .9em}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink); outline-offset:2px; border-radius:8px}
::selection{background:var(--accent); color:var(--on-accent)}

/* ---------------- shell ---------------- */
.app{
  width:100%; max-width:var(--app); background:var(--paper);
  height:100vh; height:100dvh; display:flex; flex-direction:column;
  border-left:1px solid var(--edge); border-right:1px solid var(--edge);
  transition:background .3s ease, color .3s ease;
}
@media (max-width:540px){ .app{border:0} }
.top{
  flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:9px 14px calc(9px + env(safe-area-inset-top));
  background:var(--paper); border-bottom:1px solid var(--edge);
}
.brand{display:flex; align-items:center; gap:9px; background:none; border:0; padding:3px 2px}
.brand svg{margin:0}
.brand .nm{font-family:var(--display); font-weight:800; font-size:calc(var(--fs) * 1.06); letter-spacing:-.02em}
.talk{
  background:var(--card); border:1px solid var(--edge); border-radius:999px;
  padding:8px 13px; font-size:calc(var(--fs) - 3.5px); font-weight:700; white-space:nowrap;
  min-height:38px; display:flex; align-items:center; gap:7px; box-shadow:var(--shadow);
}
.talk::before{content:''; width:8px;height:8px;border-radius:50%;background:var(--alert);flex:none}

.screen{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:18px 16px 30px; scroll-behavior:smooth}
.screen.ask{display:flex; flex-direction:column}
.screen>section{margin-bottom:28px}
.screen>section:last-child{margin-bottom:0}
.lede{color:var(--ink-70); font-size:calc(var(--fs) - 1px); margin:6px 0 0}

@keyframes enter{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.screen.go{animation:enter .3s cubic-bezier(.22,.7,.3,1) both}

.tabs{flex:none; display:flex; background:var(--paper); border-top:1px solid var(--edge);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1; background:none; border:0; border-radius:14px; min-height:48px; padding:5px 2px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  font-size:10.5px; font-weight:700; color:var(--ink-45); transition:color .2s ease}
.tabs .ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .ic{transform:translateY(-2px) scale(1.08)}

/* ---------------- pieces ---------------- */
.card{background:var(--card); border:1px solid var(--edge); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.row{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--edge); border-radius:16px;
  padding:13px 14px; margin-bottom:9px; min-height:58px; box-shadow:var(--shadow);
  transition:transform .16s ease}
.row:active{transform:scale(.985)}
.row:last-child{margin-bottom:0}
.row .txt{flex:1; min-width:0}
.row .t{display:block; font-family:var(--display); font-weight:600; font-size:calc(var(--fs) - 1px); line-height:1.25}
.row .s{display:block; font-size:calc(var(--fs) - 3.5px); color:var(--ink-45); margin-top:3px}
.row .chev{flex:none; color:var(--ink-45); font-size:19px; line-height:1}
.row .thumb{flex:none;width:50px;height:50px;border-radius:14px;display:block}

.btn{background:var(--btn); color:var(--btn-ink); border:0; border-radius:999px;
  padding:12px 20px; font-weight:700; min-height:46px; font-size:var(--fs);
  transition:transform .16s ease, opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--ink-12)}
.btn.tint{background:var(--accent); color:var(--on-accent)}
.btn:disabled{opacity:.45}
.back{background:none;border:0;padding:6px 0;color:var(--ink-70);font-weight:700;
  font-size:calc(var(--fs) - 2px);margin-bottom:8px;min-height:38px}

.pillrow{display:flex; gap:8px; flex-wrap:wrap}
.pill{background:var(--card); border:1px solid var(--ink-12); border-radius:999px;
  padding:9px 15px; font-size:calc(var(--fs) - 2.5px); font-weight:700; min-height:42px;
  transition:transform .15s ease}
.pill:active{transform:scale(.96)}
.pill[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:transparent}

.lbl{font-size:calc(var(--fs) - 4.5px); font-weight:700; color:var(--ink-45); margin:0 0 8px}
.quote{border-radius:var(--r); padding:18px; background:var(--p3)}
.quote p{font-family:var(--display); font-weight:600; font-size:calc(var(--fs) + 2px);
  line-height:1.3; margin:0; color:var(--ink)}
.quote p.lbl{font-family:var(--body); font-weight:700; font-size:calc(var(--fs) - 4.5px);
  color:var(--ink-70); margin:0 0 9px}

.myth-hero{padding:6px 0 2px}
.claim{font-family:var(--display); font-weight:800; font-size:calc(var(--fs) * 1.48); line-height:1.2;
  color:var(--ink-45); display:inline;
  background:linear-gradient(var(--alert),var(--alert)) 0 60%/100% 5px no-repeat; padding:0 2px}
.fix{margin:16px 0 0; font-size:calc(var(--fs) - .5px)}

.acc{border:1px solid var(--edge); border-radius:16px; background:var(--card);
  margin-bottom:9px; overflow:hidden; box-shadow:var(--shadow)}
.acc>summary{list-style:none; cursor:pointer; padding:14px; min-height:56px;
  display:flex; align-items:center; gap:12px;
  font-family:var(--display); font-weight:600; font-size:calc(var(--fs) - 1.5px); line-height:1.3}
.acc>summary::-webkit-details-marker{display:none}
.acc .plus{margin-left:auto; flex:none; color:var(--ink-45); font-size:21px; line-height:1; transition:transform .25s ease}
.acc[open] .plus{transform:rotate(45deg)}
.acc[open]>summary{background:var(--ink-06)}
.acc .ans{padding:13px 14px 15px; font-size:calc(var(--fs) - 1.5px); color:var(--ink-70); margin:0}

.short{border-radius:16px; padding:15px 16px; margin:16px 0 22px; background:var(--p2)}
.short .lbl{color:var(--ink-70)}
.short ul{margin:0; padding-left:19px; font-size:calc(var(--fs) - 1.5px)}
.short li{margin-bottom:6px} .short li:last-child{margin-bottom:0}
.body h3{margin:26px 0 8px}
.body ul{padding-left:19px; font-size:var(--fs)}
.body li{margin-bottom:7px}
.pull{border-left:4px solid var(--t1); padding:2px 0 2px 15px; margin:22px 0;
  font-family:var(--display); font-size:calc(var(--fs) + 1px); font-weight:600; line-height:1.3}
.meta{color:var(--ink-45); font-size:calc(var(--fs) - 3.5px); margin:6px 0 0}

.dish{width:100%; height:150px; border-radius:16px; display:block; margin-bottom:14px}
.mealhead{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px}
.mealhead .when{font-size:calc(var(--fs) - 4.5px);font-weight:700;color:var(--ink-45)}
.ing{list-style:none; padding:0; margin:0}
.ing li{padding:9px 0; border-bottom:1px solid var(--ink-06); font-size:var(--fs)}
.steps{counter-reset:s; list-style:none; padding:0; margin:0}
.steps li{counter-increment:s; position:relative; padding-left:37px; margin-bottom:14px; font-size:var(--fs)}
.steps li::before{content:counter(s); position:absolute; left:0; top:0;
  width:26px;height:26px;border-radius:9px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px}
.flag{display:inline-block;background:var(--ink-06);border-radius:999px;padding:4px 11px;
  font-size:calc(var(--fs) - 4.5px);font-weight:700;margin:0 6px 6px 0;color:var(--ink-70)}

.q{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.q .prompt{font-family:var(--display);font-weight:600;font-size:calc(var(--fs) - .5px);line-height:1.3;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--ink-12);border-radius:12px;padding:12px 13px;margin-bottom:7px;
  font-size:calc(var(--fs) - 1.5px); min-height:46px; transition:transform .15s ease}
.opt:active:not(:disabled){transform:scale(.985)}
.opt.right{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700}
.opt.wrong{background:var(--alert);border-color:transparent;color:var(--line)}
.explain{font-size:calc(var(--fs) - 2.5px);color:var(--ink-70);margin:11px 0 0;padding-top:11px;border-top:1px solid var(--ink-06)}

.cluebar{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--on-accent);
  border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:calc(var(--fs) - 2.5px);min-height:48px}
.cluebar .n{font-family:var(--display);font-weight:800;flex:none}
.cluebar button{background:rgba(255,255,255,.55);border:0;border-radius:9px;padding:6px 10px;
  font-size:12.5px;font-weight:700;margin-left:auto;flex:none;min-height:34px;color:var(--on-accent)}
.cw{display:grid;gap:2px;background:var(--ink-12);padding:2px;border-radius:7px;width:max-content;max-width:100%;margin:0 auto}
.cw .cell{position:relative;width:var(--cell,30px);height:var(--cell,30px);background:var(--ink-12)}
.cw .cell.open{background:var(--card)}
.cw input{width:100%;height:100%;border:0;background:none;text-align:center;padding:0;
  font-family:var(--display);font-weight:600;font-size:calc(var(--cell,30px) * .52);
  text-transform:uppercase;color:var(--ink)}
.cw input:focus{background:var(--p1);outline:none}
.cw .cell.here input{background:var(--p2)}
.cw .cell.done input{background:var(--accent);color:var(--on-accent)}
.cw .num{position:absolute;top:0;left:2px;font-size:8.5px;color:var(--ink-45);pointer-events:none;line-height:1.3}
details.clues summary{cursor:pointer;font-weight:700;font-size:calc(var(--fs) - 2px);padding:10px 0;min-height:42px}
details.clues ol{padding-left:22px;font-size:calc(var(--fs) - 2px);margin:0 0 14px}
details.clues h4{font-family:var(--display);font-size:calc(var(--fs) - 3px);margin:8px 0 6px}

.stat{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:15px;box-shadow:var(--shadow)}
.stat .big{font-family:var(--display);font-weight:800;font-size:calc(var(--fs) * 1.82);line-height:1;letter-spacing:-.03em}
.stat .cap{font-size:calc(var(--fs) - 4px);color:var(--ink-45);margin-top:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:10px;border-radius:999px;background:var(--ink-06);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.3,1);background:var(--t1)}
.streak{background:var(--p1);border-radius:var(--r);padding:20px;text-align:center;border:1px solid var(--edge)}
.streak .big{font-family:var(--display);font-weight:800;font-size:calc(var(--fs) * 2.7);line-height:1;letter-spacing:-.03em}

textarea,input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 13px;border-radius:13px;
  border:1px solid var(--ink-12);background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:700;font-size:calc(var(--fs) - 3px);margin:0 0 6px}
.field{margin-bottom:14px}

.voice{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.voice p.said{margin:0;font-size:var(--fs)}
.voice .who{font-size:calc(var(--fs) - 4px);color:var(--ink-45);margin:11px 0 0}

.chat{display:flex;flex-direction:column;flex:1;min-height:260px;background:var(--card);
  border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.log{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:11px 14px;border-radius:16px;font-size:calc(var(--fs) - 1.5px);line-height:1.45;white-space:pre-wrap}
.msg.bot{background:var(--ink-06);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--p2);border-bottom-right-radius:5px;align-self:flex-end}
.suggest{display:flex;gap:7px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.suggest button{background:var(--paper);border:1px solid var(--ink-12);border-radius:999px;
  padding:8px 13px;font-size:calc(var(--fs) - 3.5px);white-space:nowrap;min-height:38px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--edge)}
.composer input{flex:1}

.line{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow)}
.line .nm{font-family:var(--display);font-weight:600;font-size:calc(var(--fs) - .5px)}
.line .num{font-family:var(--display);font-weight:800;font-size:calc(var(--fs) * 1.35);margin:6px 0 5px;
  display:inline-block;color:var(--ink);text-decoration:none;border-bottom:3px solid var(--accent)}
.line .det{font-size:calc(var(--fs) - 2.5px);color:var(--ink-70);margin:0}
.note{background:var(--ink-06);border-radius:16px;padding:15px;font-size:calc(var(--fs) - 2.5px);color:var(--ink-70)}
.note p{margin:0}
.note strong{color:var(--ink)}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatch{border:2px solid var(--edge);border-radius:16px;padding:13px;text-align:left;background:var(--card);
  transition:transform .15s ease}
.swatch:active{transform:scale(.97)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.swatch .dots{display:flex;gap:5px;margin-bottom:10px}
.swatch .dots i{width:20px;height:20px;border-radius:7px;display:block;border:1px solid rgba(0,0,0,.12)}
.swatch .nm{font-family:var(--display);font-weight:600;font-size:calc(var(--fs) - 1.5px);display:block}
.swatch .sub{font-size:calc(var(--fs) - 4.5px);color:var(--ink-45);margin-top:2px;display:block}

.onb{position:fixed;inset:0;z-index:90;background:var(--paper);display:flex;justify-content:center}
.onb .inner{width:100%;max-width:var(--app);display:flex;flex-direction:column;
  padding:calc(24px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.onb h1{font-size:calc(var(--fs) * 1.78);margin-bottom:8px}
.dotrow{display:flex;gap:6px;margin-bottom:22px}
.dotrow i{height:4px;flex:1;border-radius:999px;background:var(--ink-12)}
.dotrow i.on{background:var(--t1)}

.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:16px;z-index:99;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .screen{scroll-behavior:auto}}
</style>
</head>

function applyTheme(id){
  const t=THEMES.find(x=>x.id===id)||THEMES[0];
  document.documentElement.setAttribute('data-theme',t.id);
  Store.set('theme',t.id);
  const tc=document.getElementById('tc');
  if(tc) tc.setAttribute('content',getComputedStyle(document.documentElement).getPropertyValue('--tc').trim()||'#F5F3EC');
  drawLogo();
}
function applySize(id){

 {id:'teens', title:"Your body needs more in your teens, not less", read:"3 min", art:'bowl',
  blurb:"The diet advice you see was written for adults who have finished growing.",
  short:["Your teens are the biggest growth period since you were a baby.",

         "Tired all the time? Ask a doctor for a blood test, not a diet change."],
  body:[
   {p:"Between about 11 and 18 your body builds most of the bone you will ever have, gains most of your adult height, and rewires large parts of your brain. That work is expensive. You often need more food in these years than at any later point in your life."},
   {h:"The advice was not written for you"},
   {p:"Nearly all popular diet content is aimed at adults whose bodies have finished building. Using it on a body that is still growing is not a milder version of the same thing — it is a different situation with different consequences."},
   {p:"Eating too little in these years can delay puberty, stop periods, and lower the bone strength you carry for the rest of your life. Around 90% of your adult bone is laid down by about age 18, and it is very hard to make up later."},
   {q:"Your body is not misbehaving by needing more. It is doing the biggest job it will ever do."},
   {h:"Iron, once your periods start"},
   {p:"Iron deficiency is one of the most common nutrition problems in teenage girls worldwide. It looks like exhaustion, being out of breath on stairs, cold hands and poor concentration — all easy to blame on stress or a late night."},

   {p:"If you are tired in a way sleep does not fix, that is worth a blood test rather than a diet change. Ask about ferritin, not just haemoglobin — ferritin drops first, so it catches the problem earlier."}]},

 {id:'restrict', title:"What eating too little does to your brain", read:"3 min", art:'jar',
  blurb:"The most famous study on this was not about eating disorders at all.",
  short:["In 1944, 36 healthy men ate about half their usual food for six months.",
         "They became obsessed with food, irritable and unable to concentrate.",
         "The restriction caused it. It was not a personality problem."],
  body:[
   {p:"In 1944, researchers in Minnesota recruited 36 healthy young men to be underfed for six months, so scientists could learn how to safely feed people again after the war. They ate roughly half of what they had been eating — not extreme by the standards of modern dieting."},
   {h:"What happened to their minds"},
   {p:"The physical results were expected. The psychological ones were not, and they are why the study is still quoted constantly."},
   {p:"The men became obsessed with food. They read cookbooks for hours and collected recipes they had no way to cook. They talked about meals compulsively and some began hoarding food. Concentration collapsed. They became irritable and withdrawn. Some ate far past comfortable once food came back."},
   {q:"These were healthy, screened young men. The behaviour came from the restriction, not from them."},
   {h:"Why it matters now"},
   {p:"Almost everything on that list gets described today as a personal failing — no willpower, obsessed with food, out of control around a packet of biscuits. This study showed the cause runs the other way round. Eating too little produces the obsession."},
   {p:"So if you have ever cut back and then found you could not stop thinking about food, that is not weakness. It is the expected result."}]},

 {id:'signs', title:"How to tell if something is actually wrong", read:"3 min", art:'salad',
  blurb:"For you, or for a friend you are worried about.",

 {id:'feeds', title:"Why your feed makes you feel worse", read:"2 min", art:'glass',

 {id:'move', title:"Movement, when it stops being good for you", read:"3 min", art:'plate',

  short:["Movement helps mood, sleep, bones and concentration — that is well established.",

   {p:"That question sorts most cases quickly. Training because you want to swim further, carry your own bag up four flights, or last a whole match is one thing. Training because of a meal is another, even when the session looks identical from outside."},

/* =======================================================================
   DATES — everything rotates off the device's own clock

const pad=n=>String(n).padStart(2,'0');
function dayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayKey(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function greeting(){
  const h=new Date().getHours();
  if(h<5)  return 'Still up';
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  if(h<22) return 'Good evening';
  return 'Late one';
}
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function shuffled(arr,rnd){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const pickDaily=(arr,salt)=>arr.length?arr[Math.floor(mulberry32(todayKey()+salt)()*arr.length)]:null;

function profile(){ return Store.get('profile',null); }
function avoids(){ const p=profile(); return (p&&p.avoid)||[]; }

function okToEat(r){
  const bad=avoids();
  return !r.has.some(h=>bad.includes(h));
}
function mealOptions(meal){
  const all=RECIPES.filter(r=>r.meal===meal);
  const safe=all.filter(okToEat);
  return safe.length?{list:safe,filtered:false}:{list:all,filtered:true};
}
/* today's pick, plus the rest as swaps — rotates on its own every day */
function mealToday(meal,salt){
  const {list,filtered}=mealOptions(meal);
  if(!list.length) return null;
  const swap=Store.get('swap',{});
  const chosen=(swap.day===dayStr()&&swap[meal])?list.find(r=>r.id===swap[meal]):null;
  const order=shuffled(list,mulberry32(todayKey()+salt));
  return {pick:chosen||order[0], others:order.filter(r=>r.id!==(chosen||order[0]).id), filtered};
}
function swapMeal(meal,id){
  const swap=Store.get('swap',{});
  if(swap.day!==dayStr()) for(const k in swap) delete swap[k];
  swap.day=dayStr(); swap[meal]=id;
  Store.set('swap',swap);
  render();
}

function touchStreak(){
  const s=Store.get('streak',{last:null,count:0,best:0,days:0});
  const t=dayStr();
  if(s.last===t) return s;
  if(s.last && daysBetween(s.last,t)===1) s.count=(s.count||0)+1;
  else s.count=1;
  s.days=(s.days||0)+1;
  s.best=Math.max(s.best||0,s.count);
  s.last=t;
  Store.set('streak',s);
  return s;
}
const streak=()=>Store.get('streak',{last:null,count:0,best:0,days:0});

function mark(list,id){
  const s=Store.get(list,[]);
  if(!s.includes(id)){ s.push(id); Store.set(list,s); }
}
function unmark(list,id){
  const s=Store.get(list,[]); const i=s.indexOf(id);
  if(i>=0){ s.splice(i,1); Store.set(list,s); }
}

/* =======================================================================
   CROSSWORD
   ======================================================================= */
function buildCrossword(seed){
  let best=null;
  for(let attempt=0;attempt<50;attempt++){
    const g=attemptCrossword(seed*31+attempt);
    if(g.cols>11||g.rows>11) continue;
    const score=g.entries.length*100-(g.rows+g.cols);
    if(!best||score>best.score) best={score,g};
    if(g.entries.length>=7) break;
  }
  return best?best.g:attemptCrossword(seed);
}
function attemptCrossword(seed){
  const rnd=mulberry32(seed);
  const N=13;
  const grid=Array.from({length:N},()=>Array(N).fill(null));
  const placed=[];
  const words=shuffled(CW_WORDS,rnd).slice(0,8);

  function fits(word,r,c,dir){
    const len=word.length;
    if(dir==='A'){ if(c<0||c+len>N||r<0||r>=N) return false; }
    else          { if(r<0||r+len>N||c<0||c>=N) return false; }
    let touches=0;
    for(let i=0;i<len;i++){
      const rr=dir==='A'?r:r+i, cc=dir==='A'?c+i:c;
      const cur=grid[rr][cc];
      if(cur && cur!==word[i]) return false;
      if(cur===word[i]) touches++;
      if(!cur){
        if(dir==='A'){
          if(rr>0 && grid[rr-1][cc]) return false;
          if(rr<N-1 && grid[rr+1][cc]) return false;
        } else {
          if(cc>0 && grid[rr][cc-1]) return false;
          if(cc<N-1 && grid[rr][cc+1]) return false;
        }
      }
    }
    if(dir==='A'){
      if(c>0 && grid[r][c-1]) return false;
      if(c+len<N && grid[r][c+len]) return false;
    } else {
      if(r>0 && grid[r-1][c]) return false;
      if(r+len<N && grid[r+len][c]) return false;
    }
    return touches;
  }
  function put(word,r,c,dir,clue){
    for(let i=0;i<word.length;i++){
      const rr=dir==='A'?r:r+i, cc=dir==='A'?c+i:c;
      grid[rr][cc]=word[i];
    }
    placed.push({word,r,c,dir,clue});
  }
  const first=words.shift();
  put(first.w, Math.floor(N/2), Math.floor((N-first.w.length)/2), 'A', first.c);
  for(const entry of words){
    let best=null;
    for(const p of placed){
      for(let i=0;i<p.word.length;i++){
        for(let j=0;j<entry.w.length;j++){
          if(p.word[i]!==entry.w[j]) continue;
          const dir=p.dir==='A'?'D':'A';
          const r=p.dir==='A' ? p.r-j : p.r+i;
          const c=p.dir==='A' ? p.c+i : p.c-j;
          const t=fits(entry.w,r,c,dir);
          if(t===false||t<1) continue;
          const score=t*10-Math.abs(r-N/2)-Math.abs(c-N/2);
          if(!best||score>best.score) best={score,r,c,dir};
        }
      }
    }
    if(best) put(entry.w,best.r,best.c,best.dir,entry.c);
  }
  let minR=N,maxR=0,minC=N,maxC=0;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(grid[r][c]!==null){
    minR=Math.min(minR,r); maxR=Math.max(maxR,r);
    minC=Math.min(minC,c); maxC=Math.max(maxC,c);
  }
  const rows=maxR-minR+1, cols=maxC-minC+1;
  const cells=Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,c)=>grid[minR+r][minC+c]));
  const entries=placed.map(p=>({...p, r:p.r-minR, c:p.c-minC}));
  const nums=Array.from({length:rows},()=>Array(cols).fill(0));
  let n=0;
  entries.sort((a,b)=> a.r-b.r || a.c-b.c);
  for(const e of entries){
    if(!nums[e.r][e.c]) nums[e.r][e.c]=++n;
    e.num=nums[e.r][e.c];
  }
  return {cells,entries,rows,cols,nums};
}

    else btn.removeAttribute('aria-current');
  });

      <div class="pillrow" style="margin:22px 0">

           onclick="onbToggle('${a.id}')">${esc(a.label)}</button>`).join('')}

  if(onbStep===2){
    inner=`${dots}
      <h1>Pick a look</h1>
      <p class="lede">You can change this any time from the You tab.</p>
      <div class="themes" style="margin:22px 0">
        ${THEMES.map(t=>`
          <button class="swatch" aria-pressed="${onbTheme===t.id}" onclick="onbPickTheme('${t.id}')">

  host.innerHTML=`<div class="onb"><div class="inner">${inner}</div></div>`;
}
function onbNext(){ onbStep++; drawOnb(); }
function onbToggle(id){

  drawOnb();
}
function onbPickTheme(id){ onbTheme=id; applyTheme(id); drawOnb(); }
function onbFinish(){
  Store.set('profile',{avoid:onbAvoid, since:dayStr()});
  applyTheme(onbTheme);
  document.getElementById('onb').innerHTML='';
  touchStreak();
  render(true);
}

let cwData=null, cwDir='A';
function mountCrossword(){
  const host=document.getElementById('cw-host');
  if(!host) return;
  cwData=buildCrossword(todayKey()+55);
  const {cells,entries,rows,cols,nums}=cwData;
  const saved=Store.get('cw',{});
  const letters=(saved.day===dayStr()?saved.letters:{})||{};

  const bar=document.createElement('div');
  bar.className='cluebar';
  bar.innerHTML='<span class="n"></span><span class="c">Tap a square to see its clue.</span>';

  const grid=document.createElement('div');
  grid.className='cw';
  grid.style.gridTemplateColumns=`repeat(${cols},var(--cell))`;
  const avail=host.clientWidth||340;
  const cell=Math.max(20,Math.min(42,Math.floor((avail-6-(cols-1)*2)/cols)));
  grid.style.setProperty('--cell',cell+'px');

  function entriesAt(r,c){
    return cwData.entries.filter(e=> e.dir==='A'
      ? (e.r===r && c>=e.c && c<e.c+e.word.length)
      : (e.c===c && r>=e.r && r<e.r+e.word.length));
  }
  function highlight(r,c){
    grid.querySelectorAll('.cell.here').forEach(x=>x.classList.remove('here'));
    const here=entriesAt(r,c);
    const e=here.find(x=>x.dir===cwDir)||here[0];
    if(!e) return;
    cwDir=e.dir;
    for(let i=0;i<e.word.length;i++){
      const rr=e.dir==='A'?e.r:e.r+i, cc=e.dir==='A'?e.c+i:e.c;
      const inp=grid.querySelector(`input[data-r="${rr}"][data-c="${cc}"]`);
      if(inp) inp.parentElement.classList.add('here');
    }
    bar.querySelector('.n').textContent=e.num+(e.dir==='A'?' across':' down');
    bar.querySelector('.c').textContent=e.clue;
    let btn=bar.querySelector('button');
    if(here.length>1 && !btn){ btn=document.createElement('button'); btn.textContent='Switch'; bar.appendChild(btn); }
    if(btn){ btn.style.display=here.length>1?'':'none';
             btn.onclick=()=>{ cwDir=cwDir==='A'?'D':'A'; highlight(r,c); }; }
  }

  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const div=document.createElement('div');
    div.className='cell'+(cells[r][c]?' open':'');
    if(cells[r][c]){
      if(nums[r][c]) div.insertAdjacentHTML('beforeend',`<span class="num">${nums[r][c]}</span>`);
      const inp=document.createElement('input');
      inp.maxLength=1; inp.dataset.r=r; inp.dataset.c=c;
      inp.setAttribute('inputmode','text');
      inp.setAttribute('autocapitalize','characters');
      inp.setAttribute('aria-label',`row ${r+1} column ${c+1}`);
      inp.value=letters[r+','+c]||'';
      inp.onfocus=()=>highlight(r,c);
      inp.oninput=e=>{
        const v=e.target.value.replace(/[^A-Za-z]/g,'').toUpperCase();
        e.target.value=v;
        letters[r+','+c]=v;
        Store.set('cw',{day:dayStr(),letters});
        if(v){
          const nx=cwDir==='A'
            ? grid.querySelector(`input[data-r="${r}"][data-c="${c+1}"]`)
            : grid.querySelector(`input[data-r="${r+1}"][data-c="${c}"]`);
          if(nx) nx.focus();
        }
        paint(grid);
      };
      div.appendChild(inp);
    }
    grid.appendChild(div);
  }

  const across=entries.filter(e=>e.dir==='A').sort((a,b)=>a.num-b.num);
  const down  =entries.filter(e=>e.dir==='D').sort((a,b)=>a.num-b.num);
  const list=document.createElement('details');
  list.className='clues';
  list.innerHTML=`<summary>All clues</summary>
    <h4>Across</h4><ol>${across.map(e=>`<li value="${e.num}">${esc(e.clue)}</li>`).join('')}</ol>
    <h4>Down</h4><ol>${down.map(e=>`<li value="${e.num}">${esc(e.clue)}</li>`).join('')}</ol>`;

  host.innerHTML=''; host.appendChild(bar); host.appendChild(grid); host.appendChild(list);
  paint(grid);
}
function paint(grid){
  if(!cwData) return;
  let all=true;
  for(const e of cwData.entries){
    let ok=true;
    for(let i=0;i<e.word.length;i++){
      const r=e.dir==='A'?e.r:e.r+i, c=e.dir==='A'?e.c+i:e.c;
      const inp=grid.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
      if(!inp||inp.value!==e.word[i]){ ok=false; break; }
    }
    if(!ok){ all=false; continue; }
    for(let i=0;i<e.word.length;i++){
      const r=e.dir==='A'?e.r:e.r+i, c=e.dir==='A'?e.c+i:e.c;
      const inp=grid.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
      if(inp) inp.parentElement.classList.add('done');
    }
  }
  if(all) mark('cwdone',dayStr());
}

let chatLog=[{role:'bot',text:"Hi. Ask me anything about food, bodies, periods, energy, or something you read online that did not sound right.\n\nTwo things first: I am not a doctor, and I will not give you calorie numbers or weight advice — not to be cagey, but because those are the things most likely to make someone feel worse."}];

const RISKY=['kill myself','killing myself','suicide','suicidal','end my life','want to die',
  'dont want to be here','do not want to be here','hurt myself','hurting myself','self harm','selfharm','cut myself',
  'starve myself','starving myself','stopped eating','havent eaten','have not eaten','not eaten in',
  'skipping meals','skipped meals','purge','purging','make myself sick','making myself sick',
  'throw up after','throwing up after','vomit after','laxative','laxatives'];
const CRISIS_REPLY="I am glad you said that, and I do not want to just hand you an article.\n\nPlease talk to someone today. Embrace Lifeline in Lebanon is 1564 — free and confidential. A doctor or school counsellor is also a completely reasonable place to start, and Talk to someone at the top of the screen has both.\n\nYou are not being dramatic and you are not wasting anyone's time. That is what the line is for.";

const FALLBACK=[
 {k:['carb','carbs','carbohydrate','bread','rice','pasta'],
  a:"Carbs are your main fuel, and your brain runs almost entirely on them. Cutting them is one of the most common reasons people feel foggy and irritable through a school day.\n\nBread, rice and pasta are not a problem to manage. They are the part of the meal that keeps you going."},
 {k:['fat','fats','oil','butter','tahini'],
  a:"Dietary fat builds the wall around every cell you have, carries vitamins A, D, E and K, and is a raw material for the hormones that run your cycle.\n\nEating very little of it as a teenager can stop periods altogether. Olive oil, tahini, nuts, yoghurt and eggs are all doing real work."},
 {k:['detox','cleanse','flat tummy','skinny tea'],
  a:"Your liver and kidneys detox your blood continuously, and no tea improves on that. Most detox teas are laxatives — they move water through your gut, which changes the scale and nothing else."},
 {k:['tired','exhaust','iron','ferritin','anemia','anaemia','fatigue'],
  a:"Tiredness that sleep does not fix is worth a blood test rather than a diet change. Iron deficiency is very common once periods start.\n\nAsk about ferritin, not just haemoglobin — ferritin drops first, so it catches the problem earlier."},
 {k:['period','cycle','menstrual','missed','irregular'],
  a:"Periods stopping or going irregular is worth taking to a doctor rather than waiting out. It can happen when you are eating less than your body is using, including when your weight looks completely unchanged."},
 {k:['hate my body','ugly','disgusting','my body','look fat','feel fat'],
  a:"That is a horrible way to feel, and I am not going to try to argue you out of it with facts about bodies, because that rarely works.\n\nHow you feel about your body moves around a lot depending on sleep, stress, your cycle and what you have been looking at — which means the feeling is not a reliable measurement of anything.\n\nIf it is loud most days, that is worth telling someone."},
 {k:['diet','lose weight','calories','how many calories','weight','bmi','portion'],
  a:"I do not give calorie numbers or weight advice, and I would rather say why than dodge.\n\nFor someone your age, targets like that are the single most common starting point for eating problems, and an app is the least qualified thing to set them. Your energy needs as a teenager are genuinely high and genuinely individual.\n\nIf there is a real health reason to change something, that is a conversation with a doctor who can see your history."},
 {k:['friend','worried about','someone i know'],
  a:"The instinct is usually to say something about their eating or their body. Both tend to backfire — the first makes you someone to hide from, the second confirms bodies are being watched.\n\nWhat works better is talking about them as a person. That you have not seen them at lunch. That they seem tired. That you miss them.\n\nThere is a longer piece on this in Learn."},
 {k:['breakfast','skip','not hungry morning'],
  a:"Skipping breakfast usually moves hunger rather than removing it, and it makes concentrating through a school morning harder.\n\nIf mornings genuinely make you feel sick, something drinkable often works better — there is a smoothie in Food built for exactly that."},
 {k:['protein','muscle','gym','workout','exercise','burn','sore'],
  a:"Movement is good for mood, sleep, bones and concentration. It stops being good for you when it turns into something you owe — exercising to cancel out a meal is one of the earliest signs of disordered eating.\n\nA useful test: are you doing it for something you want to be able to do, or to undo something you ate? There is a whole piece on this in Learn."}
];
function localAnswer(q){
  const s=q.toLowerCase().replace(/['\u2019]/g,'').replace(/\s+/g,' ');
  let best=null,score=0;
  for(const f of FALLBACK){
    const hits=f.k.filter(k=>s.includes(k)).length;
    if(hits>score){score=hits;best=f;}
  }
  if(best) return best.a;
  return "I do not have a good answer for that one.\n\nLearn has the corrections to the things people repeat most, Food has things that are quick and actually filling, and Talk to someone at the top has real people.\n\nTry rephrasing — I know about carbs, fat, iron, periods, energy, feeds, movement, and worrying about a friend.";
}
async function sendChat(text){
  if(!text.trim()) return;
  chatLog.push({role:'me',text});
  const s=text.toLowerCase().replace(/['\u2019]/g,'').replace(/\s+/g,' ');
  if(RISKY.some(r=>s.includes(r))){
    chatLog.push({role:'bot',text:CRISIS_REPLY}); renderChat(); return;
  }
  chatLog.push({role:'bot',text:'…'});
  renderChat();
  let reply;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:1000,
        system:"You answer questions for teenagers on Fuel4Life, a health education app about food, bodies, movement and mental health.\n\nHard rules:\n- Never give calorie targets, weight-loss advice, goal weights, BMI, portion sizes or numeric meal plans. If asked, explain plainly why not and point to a doctor.\n- Never suggest restriction, fasting, 'earning' food through exercise, or cutting out food groups.\n- If the person mentions self-harm, suicide, purging, or not eating, respond warmly, do not lecture, and point them to Embrace Lifeline Lebanon (1564) and a doctor or school counsellor. Never describe methods.\n- You are not a doctor. Say so when it matters, without hedging every sentence.\n\nStyle: warm, direct, no baby talk, no emoji. Short paragraphs, two to four of them. Simple words — this is read by 13 to 18 year olds. British spelling. Never call foods good or bad.",
        messages:[{role:"user",content:text}]
      })
    });
    const data=await res.json();
    reply=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim();
    if(!reply) throw new Error('empty');
  }catch(e){ reply=localAnswer(text); }
  chatLog[chatLog.length-1]={role:'bot',text:reply};
  renderChat();
}
function viewAsk(){

      <div class="log" id="chat-log"></div>
      <div class="suggest">
        <button onclick="sendChat('Do carbs make you gain weight?')">Do carbs make you gain weight?</button>
        <button onclick="sendChat('Why am I tired all the time?')">Why am I tired all the time?</button>
        <button onclick="sendChat('I am worried about a friend')">I'm worried about a friend</button>
      </div>
      <form class="composer" onsubmit="event.preventDefault();const i=document.getElementById('chat-in');sendChat(i.value);i.value='';">
        <input id="chat-in" type="text" placeholder="Type your question" autocomplete="off" aria-label="Your question">
        <button class="btn" type="submit">Send</button>
      </form>
    </div>
    <div class="note" style="margin-top:14px">
      <p>It will not give you calorie numbers or weight advice, on purpose. It is not a doctor and not a counsellor.</p>
    </div>
  </section>`;
}
function renderChat(){
  const log=document.getElementById('chat-log');
  if(!log) return;
  log.innerHTML=chatLog.map(m=>`<div class="msg ${m.role==='me'?'me':'bot'}">${esc(m.text)}</div>`).join('');
  log.scrollTop=log.scrollHeight;
}

/* =======================================================================
   YOU — streak, what you have explored, check-in, theme
   ======================================================================= */
function pct(a,b){ return b?Math.round(a/b*100):0; }
function viewYou(){
  const s=streak();
  const readN=Store.get('read',[]).length, cookN=Store.get('cooked',[]).length;
  const moveN=Store.get('moved',[]).length, qN=Store.get('qbank',[]).length;
  const overall=Math.round((pct(readN,ARTICLES.length)+pct(cookN,RECIPES.length)
                +pct(moveN,MOVES.length)+pct(qN,QUIZ.length))/4);
  const hist=Store.get('checkins',[]);
  const last=hist.length?hist[hist.length-1].date:null;
  const due=!last||daysBetween(last,dayStr())>=28;
  const saved=Store.get('saved',[]).length;

  return `
  <section>
    <h1>You</h1>
    <p class="lede">Everything here stays on this device. There is no account and nothing is uploaded.</p>
  </section>

  <section>
    <div class="streak">
      <div class="big">${s.count||0}</div>
      <div style="font-weight:700;margin-top:6px">day${s.count===1?'':'s'} in a row</div>
      <div style="font-size:13px;opacity:.75;margin-top:4px">Best: ${s.best||0} · ${s.days||0} days total</div>
    </div>
  </section>

  <section>
    <h2>What you have got through</h2>
    <div class="duo" style="margin-top:12px">
      <div class="stat"><div class="big">${pct(readN,ARTICLES.length)}%</div><div class="cap">Reads · ${readN} of ${ARTICLES.length}</div>
        <div class="bar"><i style="width:${pct(readN,ARTICLES.length)}%;background:var(--t1)"></i></div></div>
      <div class="stat"><div class="big">${pct(cookN,RECIPES.length)}%</div><div class="cap">Recipes cooked · ${cookN} of ${RECIPES.length}</div>
        <div class="bar"><i style="width:${pct(cookN,RECIPES.length)}%;background:var(--t2)"></i></div></div>
      <div class="stat"><div class="big">${pct(moveN,MOVES.length)}%</div><div class="cap">Ways to move tried · ${moveN} of ${MOVES.length}</div>
        <div class="bar"><i style="width:${pct(moveN,MOVES.length)}%;background:var(--t3)"></i></div></div>
      <div class="stat"><div class="big">${pct(qN,QUIZ.length)}%</div><div class="cap">Quiz questions nailed · ${qN} of ${QUIZ.length}</div>
        <div class="bar"><i style="width:${pct(qN,QUIZ.length)}%;background:var(--t1)"></i></div></div>
    </div>
    <div class="stat" style="margin-top:10px">
      <div class="big">${overall}%</div><div class="cap">Of everything in the app, explored</div>
      <div class="bar"><i style="width:${overall}%"></i></div>
    </div>
  </section>

  <section>
    <h2>Monthly check-in</h2>
    ${due
      ? `<p class="lede">Five questions about how the month has actually felt. No weights, no measurements.</p>
         <p style="margin-top:12px"><button class="btn" onclick="go('checkin')">${last?"Do this month's":'Do your first one'}</button></p>`
      : `<p class="lede">Done for this month. Next one in ${28-daysBetween(last,dayStr())} days.</p>`}
    ${hist.length?`<div style="margin-top:14px">${trendBlock(hist)}</div>`:''}
  </section>

  <section>
    ${row('Look and feel', (THEMES.find(t=>t.id===Store.get('theme','fresh'))||THEMES[0]).name, `go('themes')`)}
    ${row('Saved', saved?saved+' thing'+(saved===1?'':'s'):'Nothing yet', `go('saved')`)}
    ${row('Stories','Anonymous, from other people',`go('voices')`)}
  </section>

  <section>
    <div class="note"><p><strong>Medical disclaimer.</strong> Fuel4Life is general health education. It is not a diagnosis or a treatment plan, and it is not a substitute for a doctor. Talk to one before changing how you eat or move, especially if you have a health condition or take medication.</p></div>
    <p style="margin-top:14px"><button class="btn ghost" onclick="clearAll()">Clear everything on this device</button></p>
  </section>`;
}
function trendBlock(hist){
  const recent=hist.slice(-3);
  return `<div class="card">
    <p class="lbl">Last ${recent.length} check-in${recent.length===1?'':'s'}</p>
    ${Object.keys(CHECK_TRENDS).map(k=>{
      const vals=recent.map(h=>h[k]||0);
      const now=vals[vals.length-1], before=vals.length>1?vals[0]:null;
      const dir=before===null?'':(now>before?' ↑':now<before?' ↓':' →');
      return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
        <span style="width:84px;font-size:14px;font-weight:700;flex:none">${CHECK_TRENDS[k]}</span>
        <span class="bar" style="flex:1;margin:0"><i style="width:${now/4*100}%"></i></span>
        <span style="width:26px;text-align:right;font-size:14px;color:var(--ink-45)">${dir}</span>
      </div>`;
    }).join('')}
    <p style="margin:12px 0 0;font-size:13.5px;color:var(--ink-45)">Arrows compare against your oldest of these ${recent.length}. It is a mood and energy picture, not a score.</p>
  </div>`;
}

let checkAnswers={};
function viewCheckin(){
  const all=CHECKIN.every(c=>checkAnswers[c.id]);
  return `
  <button class="back" onclick="go('you')">‹ You</button>
  <section>
    <h1>How has the month been?</h1>
    <p class="lede">Five questions about energy, sleep and mood. Nothing about weight or measurements — tracking those is one of the things that makes people feel worse, not better.</p>
  </section>
  ${CHECKIN.map(c=>`
    <section>
      <p style="font-family:var(--display);font-weight:600;font-size:17px;margin-bottom:11px">${esc(c.q)}</p>
      <div class="pillrow">
        ${c.a.map((opt,i)=>`<button class="pill" aria-pressed="${checkAnswers[c.id]===i+1}"
          onclick="checkAnswers['${c.id}']=${i+1};render()">${esc(opt)}</button>`).join('')}
      </div>
    </section>`).join('')}
  <section>
    <button class="btn" style="width:100%" ${all?'':'disabled'} onclick="saveCheckin()">${all?'Save this month':'Answer all five'}</button>
  </section>`;
}
function saveCheckin(){
  const hist=Store.get('checkins',[]);
  hist.push({date:dayStr(),...checkAnswers});
  Store.set('checkins',hist);
  checkAnswers={};
  go('you');
}

function viewThemes(){
  const cur=Store.get('theme','fresh');
  const av=avoids();
  return `
  <button class="back" onclick="go('you')">‹ You</button>
  <section>
    <h1>Look and feel</h1>
    <p class="lede">Changes straight away, everywhere.</p>
  </section>
  <section>
    <div class="themes">
      ${THEMES.map(t=>`
        <button class="swatch" aria-pressed="${cur===t.id}" onclick="applyTheme('${t.id}');render()">
          <span class="dots">${t.dots.map(d=>`<i style="background:${d}"></i>`).join('')}</span>
          <span class="nm">${esc(t.name)}</span>
          <span class="sub">${esc(t.sub)}</span>
        </button>`).join('')}
    </div>
  </section>
  <section>
    <h2>Text size</h2>
    <p class="lede">Makes everything bigger, not just this screen.</p>
    <div class="pillrow" style="margin-top:12px">
      ${SIZES.map(s=>`<button class="pill" aria-pressed="${Store.get('size','normal')===s.id}"
        onclick="applySize('${s.id}');render()">${esc(s.label)}</button>`).join('')}
    </div>
  </section>
  <section>
    <h2>What you don't eat</h2>
    <p class="lede">Your daily meals skip these.</p>
    <div class="pillrow" style="margin-top:12px">
      ${AVOID.map(a=>`<button class="pill" aria-pressed="${av.includes(a.id)}" onclick="toggleAvoid('${a.id}')">${esc(a.label)}</button>`).join('')}
    </div>
    <div class="note" style="margin-top:14px"><p>If you have a real allergy, always check the ingredients yourself. This filter helps, but it is not a safety system.</p></div>
  </section>`;
}
function toggleAvoid(id){
  const p=profile()||{avoid:[],since:dayStr()};
  p.avoid=p.avoid||[];
  const i=p.avoid.indexOf(id);
  if(i>=0) p.avoid.splice(i,1); else p.avoid.push(id);
  Store.set('profile',p);
  render();
}

function viewSaved(){
  const saved=Store.get('saved',[]);
  const items=saved.map(k=>{
    const [t,id]=k.split(':');
    const o=(t==='article'?ARTICLES:RECIPES).find(x=>x.id===id);
    return o?{t,o}:null;
  }).filter(Boolean);
  return `
  <button class="back" onclick="go('you')">‹ You</button>
  <section><h1>Saved</h1></section>
  <section>
    ${items.length
      ? items.map(({t,o},i)=>row(o.title, t==='article'?o.read+' read':MEALS.find(m=>m.id===o.meal).label+', '+o.time,
          `go('${t==='article'?'article':'recipe'}','${o.id}')`, t==='recipe'?thumb(o.art,i):thumb('book',i))).join('')
      : `<div class="note"><p>Nothing saved yet. Open anything in Learn or Food and press Save.</p></div>`}
  </section>`;
}

function viewVoices(){
  const mine=Store.get('voices',[]);
  const all=[...mine.map((v,i)=>({...v,idx:i})),...SEED_VOICES];
  return `
  <button class="back" onclick="go('you')">‹ You</button>
  <section>
    <h1>Stories</h1>
    <p class="lede">Anonymous, from people who have been through it. Not advice — just company.</p>
  </section>
  <section>
    ${all.map(v=>`<div class="voice">
      <p class="said">${esc(v.text)}</p>
      <p class="who">${esc(v.who||'Anonymous')}${v.sample?' · example':''}</p>
      ${!v.sample?`<p style="margin:10px 0 0"><button class="btn ghost" style="padding:8px 14px;font-size:14px;min-height:40px" onclick="delVoice(${v.idx})">Delete</button></p>`:''}
    </div>`).join('')}
  </section>
  <section>
    <h2>Add yours</h2>
    <p class="lede">It stays on this device only. Nothing is uploaded.</p>
    <div style="margin-top:14px">
      <div class="field"><label for="v-text">What do you want to say?</label>
        <textarea id="v-text" placeholder="As much or as little as you want."></textarea></div>
      <div class="field"><label for="v-who">Sign it how?</label>
        <input type="text" id="v-who" placeholder="Anonymous, 16" maxlength="40"></div>
      <button class="btn" onclick="postVoice()">Post</button>
      <p id="v-msg" style="margin-top:10px;color:var(--ink-70);font-size:15px"></p>
    </div>
  </section>`;
}
function postVoice(){
  const t=document.getElementById('v-text').value.trim();
  const w=document.getElementById('v-who').value.trim()||'Anonymous';
  if(t.length<15){ document.getElementById('v-msg').textContent='Write a bit more first — at least a sentence.'; return; }
  const list=Store.get('voices',[]); list.unshift({text:t,who:w}); Store.set('voices',list); render();
}
function delVoice(i){
  const list=Store.get('voices',[]); list.splice(i,1); Store.set('voices',list); render();
}

function viewTalk(){
  return `
  <button class="back" onclick="history.length>1?history.back():go('home')">‹ Back</button>
  <section>
    <h1>Talk to someone</h1>
    <p class="lede">You do not have to be in crisis, and you do not have to be sure anything is wrong.</p>
  </section>
  <section>
    ${HELPLINES.map(h=>`<div class="line">
      <div class="nm">${esc(h.name)}</div>
      <a class="num" href="tel:${esc(h.num.replace(/[^0-9+]/g,''))}">${esc(h.num)}</a>
      <p class="det">${esc(h.det)}</p></div>`).join('')}
    <div class="line">
      <div class="nm">A doctor, or your school counsellor</div>
      <p class="det" style="margin-top:6px">Usually the fastest route to everything else, and the one most people skip. A counsellor can arrange things without you having to explain it at home first.</p>
    </div>
  </section>
  <section>
    <h2>What to actually say</h2>
    <p class="lede">Most people get stuck on the first sentence. Read one straight off the screen.</p>
    <div style="margin-top:12px">
      ${["I think my thinking about food has got loud and I want to talk to someone.",
         "I have been really tired. Can we check my iron?",
         "I am worried about a friend and I do not know how to bring it up.",
         "I do not think it is serious, but I would rather ask early than late."]
        .map(s=>`<div class="card" style="margin-bottom:9px;font-size:16px">${esc(s)}</div>`).join('')}
    </div>
    <p class="lede" style="margin-top:12px">None of these commits you to anything. They just open the door.</p>
  </section>`;
}

function clearAll(){
  if(!confirm('Delete everything this app has stored on this device, including your streak and check-ins?')) return;
  ['saved','voices','quiz','cw','profile','streak','read','cooked','moved','qbank','checkins','swap','cwdone']
    .forEach(k=>Store.del(k));
  location.hash='#/home';
  location.reload();
}

/* =======================================================================
   RENDER
   ======================================================================= */
function render(animate){
  const el=document.getElementById('main');
  let html;
  switch(route.view){
    case 'food':    html=viewFood(); break;
    case 'recipe':  html=viewRecipe(route.arg); break;
    case 'move':    html=viewMove(); break;
    case 'movedet': html=viewMoveDet(route.arg); break;
    case 'learn':   html=viewLearn(); break;
    case 'article': html=viewArticle(route.arg); break;
    case 'daily':   html=viewDaily(); break;
    case 'ask':     html=viewAsk(); break;
    case 'you':     html=viewYou(); break;
    case 'themes':  html=viewThemes(); break;
    case 'checkin': html=viewCheckin(); break;
    case 'saved':   html=viewSaved(); break;
    case 'voices':  html=viewVoices(); break;
    case 'talk':    html=viewTalk(); break;
    default:        html=viewHome();
  }
  el.className='screen'+(route.view==='ask'?' ask':'')+(animate?' go':'');
  el.innerHTML=html;
  markTabs();
  if(route.view==='daily') mountCrossword();
  if(route.view==='ask') renderChat();
}

/* =======================================================================
   BOOT
   ======================================================================= */
applyTheme(Store.get('theme','fresh'));
applySize(Store.get('size','normal'));
buildTabs();
drawLogo();
(function boot(){
  const parts=location.hash.replace(/^#\//,'').split('/');
  if(parts[0]) route={view:parts[0],arg:parts[1]||null};
  if(!profile()){ render(); showOnboarding(); return; }
  touchStreak();
  render(true);
})();
/* a phone left open overnight should wake up on the new day */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    const s=streak();
    if(s.last!==dayStr()){ touchStreak(); quizState=null; render(); }
  }
});

</script>
</body>
</html>
